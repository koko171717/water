<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#091e30"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Mon eau</title><style>*{box-sizing:border-box}body{margin:0;background:#091e30;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100svh;display:grid;place-items:center}.app{width:min(100%,430px);padding:28px 22px 40px;text-align:center}.brand{color:#aee7ff;font-weight:750;letter-spacing:.15em;font-size:14px}.glass{height:230px;width:170px;margin:25px auto 16px;position:relative;clip-path:polygon(10% 0,90% 0,83% 100%,17% 100%);border-radius:8px 8px 28px 28px;background:#203a4c;overflow:hidden}.water{position:absolute;bottom:0;left:0;width:100%;height:0;background:linear-gradient(#66dcf3,#0781c7);transition:height .3s}.glass:after{content:'';position:absolute;inset:0;border:4px solid #a0d5ec;border-radius:8px 8px 28px 28px;pointer-events:none}.total{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}.sub{color:#a8c5d5;font-size:14px;margin:5px 0 20px}.portions{background:#18374b;border-radius:16px;padding:18px;margin-bottom:22px}.portions strong{display:block;font-size:35px;font-variant-numeric:tabular-nums}.portions span{font-size:13px;color:#b7d5e6}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0;border-radius:13px;padding:17px 4px;font-weight:700}.add{background:#168ec9;color:white;font-size:16px}.add:active{background:#0b6fa4}.reset{background:transparent;color:#c6deea;border:1px solid #547185;margin-top:20px;width:100%;font-size:15px}.note{color:#779aaa;font-size:12px;margin-top:20px}</style></head><body><main class="app"><div class="brand">💧 MON EAU</div><div class="glass" aria-hidden="true"><div id="water" class="water"></div></div><div class="total" id="total">0 ml</div><div class="sub">Total consommé</div><div class="portions"><strong id="portions">0</strong><span>Portions équivalentes de 240 ml</span></div><div class="buttons"><button class="add" data-ml="240">+ 240 ml</button><button class="add" data-ml="300">+ 300 ml</button><button class="add" data-ml="500">+ 500 ml</button></div><button class="reset" id="reset">↺ Remettre à zéro</button><div class="note">Enregistré uniquement sur cet appareil</div></main><script>(()=>{'use strict';const KEY='mon-eau-total-v1';let total=0;try{const saved=Number(localStorage.getItem(KEY));if(Number.isFinite(saved)&&saved>=0)total=saved}catch(e){}const $=id=>document.getElementById(id);const fmt=n=>new Intl.NumberFormat('fr-CH',{maximumFractionDigits:2}).format(n);function render(){$('total').textContent=fmt(total)+' ml';$('portions').textContent=fmt(Math.round(total/240*100)/100);$('water').style.height=Math.min(total/2000,1)*100+'%'}function save(){try{localStorage.setItem(KEY,String(total))}catch(e){}}document.querySelectorAll('[data-ml]').forEach(b=>b.addEventListener('click',()=>{total+=Number(b.dataset.ml);save();render()}));$('reset').addEventListener('click',()=>{if(total>0&&!confirm('Remettre le compteur à zéro ?'))return;total=0;save();render()});render()})();</script></body></html>
