<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#081d30"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Mon eau</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#071a2c,#103b57);color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;display:grid;place-items:center;padding:22px}.app{width:min(100%,420px);text-align:center}.eyebrow{font-size:13px;letter-spacing:3px;color:#9bdcf4;font-weight:700}.glass{height:230px;width:180px;margin:26px auto 12px;position:relative;clip-path:polygon(10% 0,90% 0,82% 100%,18% 100%);background:rgba(255,255,255,.09);border:2px solid #a6d9ef}.water{position:absolute;bottom:0;left:0;width:100%;height:0%;background:linear-gradient(#58d8f1,#0878c0);transition:height .35s}.shine{position:absolute;top:14px;bottom:20px;left:25px;width:7px;background:#ffffff35;border-radius:10px}.total{font-size:46px;font-weight:750;letter-spacing:-2px}.unit{font-size:19px;color:#bad9e9}.sub{color:#a7c5d6;font-size:14px;margin-top:6px}.portion{margin:26px 0 18px;background:#ffffff12;border:1px solid #ffffff1a;border-radius:18px;padding:18px}.portion strong{font-size:34px;display:block}.portion span{font-size:13px;color:#b9d9e8}.buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}button{cursor:pointer;touch-action:manipulation;font:inherit;border-radius:14px;min-height:60px;border:0;font-weight:750}.add{background:#4cc8ee;color:#06273b;font-size:17px}.add:active{transform:scale(.97)}.reset{width:100%;margin-top:16px;background:transparent;border:1px solid #7598ac;color:#d8eaf3;min-height:48px;font-size:15px}.note{font-size:12px;color:#91b1c3;margin-top:20px}</style></head><body><main class="app"><div class="eyebrow">💧 MON EAU</div><div class="glass" aria-hidden="true"><div class="water" id="water"></div><div class="shine"></div></div><div><span class="total" id="total">0</span> <span class="unit">ml</span></div><div class="sub">Total consommé</div><div class="portion"><strong id="portions">0</strong><span>Portions équivalentes de 240 ml</span></div><div class="buttons"><button class="add" data-ml="240">+ 240 ml</button><button class="add" data-ml="300">+ 300 ml</button><button class="add" data-ml="500">+ 500 ml</button></div><button class="reset" id="reset">↺ Remettre à zéro</button><div class="note">Aucune donnée enregistrée · Remise à zéro au rechargement</div></main><script>let total=0;const totalEl=document.getElementById('total'),portionsEl=document.getElementById('portions'),waterEl=document.getElementById('water');function update(){totalEl.textContent=total.toLocaleString('fr-CH');portionsEl.textContent=Number((total/240).toFixed(2)).toLocaleString('fr-CH');waterEl.style.height=Math.min(total/2000*100,100)+'%'}document.querySelectorAll('[data-ml]').forEach(button=>button.addEventListener('click',()=>{total+=Number(button.dataset.ml);update()}));document.getElementById('reset').addEventListener('click',()=>{total=0;update()});update();</script></body></html>
